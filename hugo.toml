# -- Theme parameters ---------------------------------------------------

[params]
  description = "Linux kernel and hypervisor engineering: KVM, emulators, reverse engineering."
  mainSections = ["posts"]
  # Try "github", "noir", "ocean" or "terminal" for a different feel.
  colorScheme = "slate"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  disableImageOptimizationMD = true
  dateFormat = "2 January 2006"
  copyright = "© 2026 Stjepan Poljak"

  [params.author]
    name = "Stjepan Poljak"
    image = "images/small-profile.png"
    headline = "Linux kernel & hypervisor engineer"
    links = [
      { github = "https://github.com/StjepanPoljak" },
      { linkedin = "https://linkedin.com/in/stjepan-poljak" },
      { email = "mailto:stjepan.poljak@protonmail.com" },
    ]

  [params.header]
    layout = "fixed-fill-blur"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "profile"
    showRecent = true
    showRecentItems = 5
    showMoreLink = true
    showMoreLinkDest = "/posts/"
    cardView = false

  [params.article]
    showDate = true
    showAuthor = false
    showHero = false
    showBreadcrumbs = true
    showDraftLabel = true
    seriesOpened = false
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showWordCount = false
    showTableOfContents = true
    showTaxonomies = true
    showRelatedContent = true
    relatedContentLimit = 3

  [params.list]
    showBreadcrumbs = false
    showSummary = true
    showCards = false
    groupByYear = true
    cardView = false

  [params.taxonomy]
    showTermCount = true
    cardView = false

  [params.term]
    showBreadcrumbs = true
    showTableOfContents = false
    groupByYear = false
    cardView = false
