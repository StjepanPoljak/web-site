baseURL = "https://poljak-engineering.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Stjepan Poljak"
theme = "blowfish"

enableRobotsTXT = true
summaryLength = 0
enableEmoji = true
# Keep tag names as written (x86, strace, eBPF) instead of Title Casing them.
capitalizeListTitles = false

[pagination]
  pagerSize = 100

# Post images live in static/images (they are linked as /images/... from
# Markdown). Mount them into assets as well so Blowfish can use them as
# feature images and thumbnails on cards.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static"
    target = "static"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "series"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "tags"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

