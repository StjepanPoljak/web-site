{{- /* Render .Content first so the mermaid code block hook has set the flag. */}}
{{- $_ := .Content }}
{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

  /* Colors mirror PaperMod's theme-vars.css so diagrams blend with the page. */
  const palettes = {
    light: {
      bg: '#ffffff', fill: '#f5f5f5', border: '#d6d6d6',
      text: '#1f1f1f', muted: '#6c6c6c', note: '#f5f5f5', noteBorder: '#d6d6d6',
    },
    dark: {
      bg: '#1d1e20', fill: '#182e44', border: '#2f5577',
      text: '#dadadb', muted: '#9b9c9d', note: '#182e44', noteBorder: '#2f5577',
    },
  };

  const themeVariables = (p) => ({
    darkMode: p === palettes.dark,
    fontFamily: '"Courier New", Courier, "Liberation Mono", monospace',
    fontSize: '14px',
    background: p.bg,
    mainBkg: p.fill,
    primaryColor: p.fill,
    primaryBorderColor: p.border,
    primaryTextColor: p.text,
    secondaryColor: p.fill,
    tertiaryColor: p.bg,
    lineColor: p.muted,
    textColor: p.text,
    nodeBorder: p.border,
    clusterBkg: p.bg,
    clusterBorder: p.border,
    edgeLabelBackground: p.bg,
    titleColor: p.text,
    /* sequence diagrams */
    actorBkg: p.fill,
    actorBorder: p.border,
    actorTextColor: p.text,
    actorLineColor: p.border,
    signalColor: p.muted,
    signalTextColor: p.text,
    labelBoxBkgColor: p.fill,
    labelBoxBorderColor: p.border,
    labelTextColor: p.text,
    loopTextColor: p.text,
    noteBkgColor: p.note,
    noteBorderColor: p.noteBorder,
    noteTextColor: p.text,
    activationBkgColor: p.fill,
    activationBorderColor: p.border,
    sequenceNumberColor: p.bg,
  });

  const nodes = [...document.querySelectorAll('pre.mermaid')];
  nodes.forEach((n) => (n.dataset.source = n.textContent));

  const isDark = () => document.documentElement.dataset.theme === 'dark';
  let rendered = null;

  async function render() {
    const dark = isDark();
    if (dark === rendered) return;
    rendered = dark;
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: themeVariables(dark ? palettes.dark : palettes.light),
      sequence: { mirrorActors: false },
      flowchart: { wrappingWidth: 400, nodeSpacing: 24, subGraphTitleMargin: { top: 8, bottom: 12 } },
    });
    nodes.forEach((n) => {
      n.removeAttribute('data-processed');
      n.textContent = n.dataset.source;
    });
    await mermaid.run({ nodes });
    nodes.forEach(alignRects);
    nodes.forEach(extendLifelines);
    nodes.forEach(leftAlignClusterTitles);
    nodes.forEach(addComments);
  }

  /* Without mirrored actors Mermaid can stop lifelines short; run them to the last message or rect. */
  function extendLifelines(n) {
    const lifelines = n.querySelectorAll('svg line.actor-line');
    const items = [...n.querySelectorAll('svg .messageLine0, svg .messageLine1, svg rect.rect')];
    if (!lifelines.length || !items.length) return;
    const bottom = Math.max(...items.map((el) => { const b = el.getBBox(); return b.y + b.height; }));
    lifelines.forEach((l) => {
      if (l.y2.baseVal.value < bottom) l.setAttribute('y2', bottom);
    });
  }

  /* Subgraph titles read like struct names, so put them top-left instead of centred. */
  function leftAlignClusterTitles(n) {
    n.querySelectorAll('svg g.cluster').forEach((g) => {
      const rect = g.querySelector(':scope > rect');
      const label = g.querySelector(':scope > g.cluster-label');
      const m = label?.getAttribute('transform')?.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
      if (!rect || !m) return;
      label.setAttribute('transform', `translate(${rect.x.baseVal.value + 10}, ${m[2]})`);
    });
  }

  /*
   * Side comments next to numbered messages, without adding rows:
   *   %% comment 10: text<br/>more text
   *   %% comment 10 left: text
   * Mermaid ignores %% lines, so we parse them from the source ourselves.
   */
  const SVG = 'http://www.w3.org/2000/svg';
  const GAP = 16, PAD_X = 10, PAD_Y = 6, LINE = 18;

  function addComments(n) {
    const re = /^\s*%%\s*comment\s+(\d+)(?:\s+(left|right))?\s*:\s*(.+)$/gm;
    const comments = [...n.dataset.source.matchAll(re)];
    const svg = n.querySelector('svg');
    if (!comments.length || !svg) return;

    const lifelines = [...svg.querySelectorAll('line.actor-line')].map((l) => l.x1.baseVal.value);
    const rects = [...svg.querySelectorAll('rect.rect')];
    const right = Math.max(...lifelines, ...rects.map((r) => r.x.baseVal.value + r.width.baseVal.value));
    const left = Math.min(...lifelines, ...rects.map((r) => r.x.baseVal.value));
    const numbers = [...svg.querySelectorAll('text.sequenceNumber')];
    const vb = svg.viewBox.baseVal;
    let minX = vb.x, maxX = vb.x + vb.width;

    for (const [, num, side = 'right', body] of comments) {
      const anchor = numbers.find((t) => t.textContent.trim() === num);
      if (!anchor) continue;
      /* Centre on the message: midway between its label and its arrow. */
      const cy = anchor.y.baseVal[0].value - 14;
      const lines = body.split(/<br\s*\/?>/i);

      const g = document.createElementNS(SVG, 'g');
      const box = document.createElementNS(SVG, 'rect');
      const text = document.createElementNS(SVG, 'text');
      box.setAttribute('class', 'note');
      text.setAttribute('class', 'noteText');
      text.setAttribute('dominant-baseline', 'central');
      text.style.fontSize = '14px';
      lines.forEach((l, i) => {
        const t = document.createElementNS(SVG, 'tspan');
        t.setAttribute('x', 0);
        t.setAttribute('dy', i ? LINE : 0);
        t.textContent = l;
        text.appendChild(t);
      });
      g.append(box, text);
      svg.appendChild(g);

      const w = text.getBBox().width + 2 * PAD_X;
      const h = lines.length * LINE + 2 * PAD_Y;
      const x = side === 'left' ? left - GAP - w : right + GAP;
      const top = cy - h / 2;
      box.setAttribute('x', x);
      box.setAttribute('y', top);
      box.setAttribute('width', w);
      box.setAttribute('height', h);
      text.setAttribute('x', x + PAD_X);
      text.setAttribute('y', top + PAD_Y + LINE / 2);
      text.querySelectorAll('tspan').forEach((t) => t.setAttribute('x', x + PAD_X));
      minX = Math.min(minX, x - GAP);
      maxX = Math.max(maxX, x + w + GAP);
    }

    svg.setAttribute('viewBox', `${minX} ${vb.y} ${maxX - minX} ${vb.height}`);
    svg.style.maxWidth = `${maxX - minX}px`;
  }

  /* Side notes widen only their own `rect` block; stretch all blocks to the widest. */
  function alignRects(n) {
    const rects = [...n.querySelectorAll('svg rect.rect')];
    if (rects.length < 2) return;
    const x = Math.min(...rects.map((r) => r.x.baseVal.value));
    const right = Math.max(...rects.map((r) => r.x.baseVal.value + r.width.baseVal.value));
    rects.forEach((r) => {
      r.setAttribute('x', x);
      r.setAttribute('width', right - x);
    });
  }

  render();
  /* PaperMod's theme toggle flips data-theme on <html>. */
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
{{- end }}
